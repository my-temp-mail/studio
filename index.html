<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Monetization OS - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111827;
}

.login-box{
    width:400px;
    max-width:92%;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:8px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin:12px 0 6px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #dbe1ea;
    border-radius:9px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.error{
    background:#fee2e2;
    color:#b91c1c;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
    display:none;
}

.loading{
    text-align:center;
    color:#64748b;
    margin-top:15px;
    display:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        Social<span>OS</span>
    </div>

    <p class="subtitle">
        Social Media Monetization System
    </p>

    <div id="error" class="error"></div>

    <label>Email</label>

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
    >

    <label>Password</label>

    <input
        id="password"
        type="password"
        placeholder="Enter your password"
    >

    <button id="loginBtn">
        🔐 Login
    </button>

    <div id="loading" class="loading">
        Logging in...
    </div>

</div>


<script type="module">

import {
    auth,
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "./firebase.js";


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const errorBox =
    document.getElementById("error");

const loading =
    document.getElementById("loading");


function showError(message){

    errorBox.innerText = message;

    errorBox.style.display = "block";

}


function hideError(){

    errorBox.style.display = "none";

}


loginBtn.addEventListener("click", async()=>{

    hideError();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        showError(
            "Email aur password dono enter karo."
        );

        return;
    }


    loginBtn.disabled = true;

    loading.style.display = "block";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(error);

        let message =
            "Login nahi ho saka.";

        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message =
                "Email ya password ghalat hai.";

        }

        if(
            error.code ===
            "auth/too-many-requests"
        ){

            message =
                "Bohat zyada attempts. Thori dair baad try karo.";

        }

        showError(message);

        loginBtn.disabled = false;

        loading.style.display = "none";

    }

});


onAuthStateChanged(auth,(user)=>{

    if(user){

        /*
        Abhi temporary Admin page par bhej rahe hain.
        Baad mein Admin/Team role automatically detect hoga.
        */

        window.location.href =
            "admin.html";

    }

});

</script>

</body>
</html>
